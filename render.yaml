# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot REST API (Dockerized Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: travel-expense-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: travel-expense-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://travel-expense-frontend.onrender.com

  # ----------------------------------------------------------------------------
  # 2. React Vite Single Page Application (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: travel-expense-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: travel-expense-backend
          property: host

# ------------------------------------------------------------------------------
# 3. Cloud PostgreSQL Managed Database
# ------------------------------------------------------------------------------
databases:
  - name: travel-expense-db
    databaseName: travelexpensedb
    user: postgres
    plan: free
    region: oregon
