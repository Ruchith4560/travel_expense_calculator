# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# ==============================================================================
services:
  # Spring Boot REST API
  - type: web
    name: voyageledger-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: voyageledger-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://voyageledger.vercel.app,https://voyageledger.onrender.com

  # React Static Web Application
  - type: web
    name: voyageledger-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: voyageledger-api
          property: host

# Cloud PostgreSQL Managed Database
databases:
  - name: voyageledger-db
    databaseName: travelexpensedb
    user: postgres
    plan: free
    region: oregon
