# ==============================================================================
# Travel Expense Calculator - Base Application Configuration
# ==============================================================================
spring.application.name=travel-expense-calculator

# Active profile defaults to dev (H2 PostgreSQL mode) for immediate zero-config execution
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator & Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# CORS allowed origins (overrideable via environment variable)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
