version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: travelexpense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelexpensedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelexpensedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelexpense-net

  # ============================================================================
  # 2. Spring Boot REST API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelexpense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/travelexpensedb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - travelexpense-net

  # ============================================================================
  # 3. React TypeScript Single Page Application (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelexpense-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - travelexpense-net

# Persistent storage for PostgreSQL
volumes:
  pgdata:
    driver: local

# Internal isolated Docker network
networks:
  travelexpense-net:
    driver: bridge
